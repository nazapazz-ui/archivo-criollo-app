<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Criollo - Generador de Contenido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: linear-gradient(135deg, #f8f9fa 0%, #e8eef8 100%); color: #1a1a1a; min-height: 100vh; }
        .container { max-width: 1400px; margin: 0 auto; padding: 24px; }
        .header { background: linear-gradient(135deg, #2E5090 0%, #1e3a5f 100%); color: white; padding: 40px; border-radius: 16px; margin-bottom: 32px; text-align: center; }
        .header h1 { font-size: 32px; margin-bottom: 8px; font-weight: 700; }
        .header p { font-size: 15px; opacity: 0.95; }
        .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 32px; }
        .form-section { background: white; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .form-section h2 { color: #2E5090; font-size: 20px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 2px solid #2E5090; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 8px; font-size: 13px; text-transform: uppercase; }
        .radio-group, .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
        .radio-option, .checkbox-option { display: flex; align-items: center; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; cursor: pointer; }
        .radio-option:hover, .checkbox-option:hover { background: #f5f5f5; border-color: #2E5090; }
        textarea, input[type="text"] { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 13px; }
        textarea:focus, input:focus { outline: none; border-color: #2E5090; }
        textarea { min-height: 120px; resize: vertical; }
        .difficulty-select { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .difficulty-btn { padding: 12px; border: 2px solid #e0e0e0; background: white; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; text-transform: uppercase; }
        .difficulty-btn.active { background: #2E5090; color: white; border-color: #2E5090; }
        .generate-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #2E5090 0%, #1e3a5f 100%); color: white; border: none; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 24px; }
        #output-content { background: #ffffff !important; }
        #output-content * { color: #1a1a1a !important; }
        #output-content h2, #output-content h3, #output-content h4 { color: #2E5090 !important; }
        #output-content .video-card { background: white !important; border-top: 4px solid #2E5090 !important; }
        #output-content .hook-box { background: #FFC107 !important; color: #000000 !important; border-left-color: #FFC107 !important; }
        #output-content .script-segment { background: #f9f9f9 !important; border-left-color: #2E5090 !important; }
        #output-content .annotation-segment { background: #E7F3FF !important; border-left-color: #2E5090 !important; }
        #output-content .annotation-segment .timecode { color: #2E5090 !important; }
        #output-content .instruction-box { background: #d4edda !important; color: #155724 !important; border-left-color: #28a745 !important; }
        #output-content .instruction-box h4 { color: #155724 !important; }
        #output-content .instruction-box li { color: #155724 !important; }
        .output-section { background: #ffffff !important; border-radius: 16px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); max-height: 90vh; overflow-y: auto; color: #1a1a1a !important; }
        .hidden { display: none; }
        .loading { text-align: center; padding: 40px; }
        .output-content { background: #f9f9f9; padding: 20px; border-radius: 12px; word-wrap: break-word; font-size: 13px; border-left: 4px solid #2E5090; }
        .video-card { background: white; border-radius: 12px; padding: 24px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-top: 4px solid #2E5090; }
        .video-card h2 { color: #2E5090; margin-bottom: 8px; font-size: 20px; }
        .video-meta { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; font-size: 13px; color: #666; padding-bottom: 16px; border-bottom: 1px solid #eee; }
        .meta-item { display: flex; gap: 6px; }
        .meta-item strong { color: #2E5090; }
        .hook-box { background: linear-gradient(135deg, #FFF3CD 0%, #FFE69C 100%); padding: 16px; border-left: 4px solid #FFC107; border-radius: 6px; margin-bottom: 24px; font-weight: 500; color: #856404; }
        .script-container { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .script-column { display: flex; flex-direction: column; gap: 16px; }
        .script-column h3 { font-size: 13px; font-weight: 600; color: #2E5090; text-transform: uppercase; letter-spacing: 0.5px; padding-bottom: 8px; border-bottom: 2px solid #2E5090; }
        .script-segment { background: #f9f9f9; padding: 16px; border-radius: 8px; border-left: 3px solid #2E5090; }
        .script-segment .timecode { font-size: 12px; font-weight: 600; color: #2E5090; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
        .script-segment .dialog { font-size: 14px; line-height: 1.5; color: #333; font-weight: 500; }
        .annotation-segment { background: #E7F3FF; padding: 16px; border-radius: 8px; border-left: 3px solid #2196F3; margin-bottom: 16px; }
        .annotation-segment .timecode { font-size: 12px; font-weight: 600; color: #1976D2; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block; }
        .annotation-list { font-size: 13px; line-height: 1.6; color: #1565C0; list-style: none; padding-left: 20px; }
        .annotation-list li { margin-bottom: 6px; padding-left: 20px; position: relative; }
        .annotation-list li::before { content: '▸'; position: absolute; left: 0; color: #2196F3; font-weight: bold; }
        .instruction-box { background: #d4edda; padding: 20px; border-left: 4px solid #28a745; border-radius: 8px; margin-top: 24px; font-size: 13px; line-height: 1.6; }
        .instruction-box h4 { color: #155724; margin-bottom: 12px; font-size: 14px; }
        .instruction-box ol { padding-left: 20px; }
        .instruction-box li { margin-bottom: 8px; color: #155724; }
        .difficulty { display: inline-block; background: #f0f0f0; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #666; }
        .difficulty.baja { background: #d4edda; color: #155724; }
        .difficulty.media { background: #fff3cd; color: #856404; }
        .difficulty.alta { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div style="font-size: 48px; margin-bottom: 12px;">AC</div>
            <h1>Generador de Contenido</h1>
            <p>Archivo Criollo - Crea TikToks, Reels e Instagram desde tu guion</p>
        </div>

        <div class="main-grid">
            <div class="form-section">
                <h2>Inputs</h2>
                <div class="form-group">
                    <label>Qué querés hacer</label>
                    <div class="radio-group">
                        <label><input type="radio" name="option" value="guion" checked> Solo guion</label>
                        <label><input type="radio" name="option" value="efemeride"> Solo efeméride/noticia</label>
                        <label><input type="radio" name="option" value="mixto"> Guion + efeméride</label>
                    </div>
                </div>
                <div class="form-group" id="guion-field">
                    <label>Guion</label>
                    <textarea id="guion" placeholder="Pega aquí el guion..."></textarea>
                </div>
                <div class="form-group hidden" id="efemeride-field">
                    <label>Efeméride o noticia</label>
                    <input type="text" id="efemeride" placeholder="Ej: Murió el Indio Solari...">
                </div>
                <div class="form-group">
                    <label>Qué querés generar</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="generate" value="1video" checked> 1 TikTok/Reel</label>
                        <label><input type="checkbox" name="generate" value="3"> 3 TikToks variados</label>
                        <label><input type="checkbox" name="generate" value="5"> 5 TikToks completos</label>
                        <label><input type="checkbox" name="generate" value="carrusel"> Carrusel Instagram</label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Dificultad</label>
                    <div class="difficulty-select">
                        <button class="difficulty-btn" data-difficulty="baja">Baja</button>
                        <button class="difficulty-btn active" data-difficulty="media">Media</button>
                        <button class="difficulty-btn" data-difficulty="alta">Alta</button>
                    </div>
                </div>
                <button class="generate-btn" onclick="generateContent()">Generar contenido</button>
            </div>

            <div class="output-section" id="output" style="display: none;">
                <h2>Contenido Generado</h2>
                <div id="output-content"></div>
            </div>
        </div>
    </div>

    <script>
        let selectedDifficulty = 'media';
        document.querySelectorAll('input[name="option"]').forEach(r => {
            r.addEventListener('change', (e) => {
                document.getElementById('guion-field').classList.toggle('hidden', e.target.value === 'efemeride');
                document.getElementById('efemeride-field').classList.toggle('hidden', e.target.value === 'guion');
            });
        });
        document.querySelectorAll('.difficulty-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedDifficulty = e.target.dataset.difficulty;
            });
        });
        async function generateContent() {
            const guion = document.getElementById('guion').value.trim();
            const efemeride = document.getElementById('efemeride').value.trim();
            if (!guion && !efemeride) { alert('Pegá un guion o efeméride'); return; }
            const tipo = document.querySelector('input[name="option"]:checked').value;
            const generar = Array.from(document.querySelectorAll('input[name="generate"]:checked')).map(x => x.value);
            if (generar.length === 0) { alert('Elegí qué generar'); return; }
            const output = document.getElementById('output');
            output.style.display = 'block';
            document.getElementById('output-content').innerHTML = '<div class="loading">Generando...</div>';
            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ guion, efemeride, tipo, generar: generar.join(', '), dificultad: selectedDifficulty })
                });
                const data = await res.json();
                document.getElementById('output-content').innerHTML = data.content || `<div class="info-box">Error: ${data.error}</div>`;
            } catch (e) {
                document.getElementById('output-content').innerHTML = `<div>Error: ${e.message}</div>`;
            }
        }
    </script>
</body>
</html>
