<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de Contenido — Archivo Criollo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62.5..125,300..900;1,62.5..125,400..700&family=Archivo+Black&family=Piazzolla:ital,opsz,wght@0,8..30,400..800&family=Space+Mono:ital,wght@0,400;0,700&display=swap" rel="stylesheet">
<style>
:root{
  --azul-50:#eef5fc; --azul-100:#d9e9f9; --azul-600:#1060b0; --azul-700:#0f5499; --azul-800:#0c4787;
  --sol-200:#f8e0aa; --sol-400:#f0bb5a; --sol-500:#e6a128; --sol-600:#c98318; --sol-700:#a96f12;
  --tinta-900:#07182a; --tinta-800:#0c2236;
  --pergamino:#f6f0df; --pergamino-2:#efe7cf; --papel:#fbf8ef; --blanco:#fdfcf6;
  --crema-700:#b8ad72; --neutral-200:#ddd9c6; --neutral-500:#6c7984;
  --verde:#2f7d57; --verde-soft:#b4d6c4; --bermellon:#c0432b;
  --hairline:rgba(12,34,54,0.12);
  --font-display:'Archivo','Archivo Black',system-ui,sans-serif;
  --font-sans:'Archivo',system-ui,sans-serif;
  --font-serif:'Piazzolla',Georgia,serif;
  --font-mono:'Space Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--pergamino); color:var(--tinta-800);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;}
.wrap{max-width:100%;margin:0 auto;padding:20px 22px 80px;}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0 20px;margin-bottom:22px;border-bottom:2px solid var(--tinta-800);}
.head-l{display:flex;align-items:center;gap:14px;}
.logo{width:54px;height:54px;object-fit:contain;}
.brand-kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--azul-600);font-weight:700;}
.brand-h1{margin:3px 0 0;font-family:var(--font-display);font-weight:900;font-size:27px;line-height:.98;color:var(--tinta-900);text-transform:uppercase;}
.beta{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:999px;border:1.5px solid var(--sol-600);color:var(--sol-700);background:var(--sol-200);}
.layout{display:grid;grid-template-columns:1fr;gap:24px;align-items:start;}
@media(min-width:920px){.layout{grid-template-columns:minmax(360px,412px) 1fr;}.form-col{position:sticky;top:20px;}}
.form-col{background:var(--papel);border:1.5px solid var(--hairline);border-radius:16px;padding:24px;}
.form-title{font-family:var(--font-display);font-weight:900;font-size:18px;margin:0 0 20px;color:var(--tinta-900);text-transform:uppercase;}
.form-group{margin-bottom:24px;}
.form-label{display:block;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--azul-600);margin-bottom:12px;}
.radio-group{display:flex;gap:12px;flex-wrap:wrap;}
.radio-btn,.checkbox-btn{flex:1;min-width:120px;padding:12px;border:2px solid var(--hairline);border-radius:8px;background:var(--blanco);cursor:pointer;font-family:var(--font-sans);font-size:13px;font-weight:600;text-transform:uppercase;transition:all .2s ease;text-align:center;}
.radio-btn:hover,.checkbox-btn:hover{border-color:var(--azul-600);background:var(--azul-50);}
.radio-btn.active,.checkbox-btn.active{background:var(--azul-600);color:white;border-color:var(--azul-600);}
textarea,input[type="text"]{width:100%;padding:12px;border:2px solid var(--hairline);border-radius:8px;font-family:var(--font-sans);font-size:13px;color:var(--tinta-900);background:var(--blanco);}
textarea:focus,input[type="text"]:focus{outline:none;border-color:var(--azul-600);box-shadow:0 0 0 3px var(--azul-50);}
textarea{min-height:120px;resize:vertical;}
.difficulty-select{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
.diff-btn{padding:12px;border:2px solid var(--hairline);background:var(--blanco);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;text-transform:uppercase;transition:all .2s;}
.diff-btn:hover{border-color:var(--azul-600);}
.diff-btn.active{background:var(--azul-600);color:white;border-color:var(--azul-600);}
.submit-btn{width:100%;padding:16px;background:var(--azul-600);color:white;border:none;border-radius:8px;font-weight:700;font-size:14px;text-transform:uppercase;cursor:pointer;transition:all .2s;}
.submit-btn:hover{background:var(--azul-700);}
.result-col{background:var(--papel);border:1.5px solid var(--hairline);border-radius:16px;padding:24px;min-height:400px;}
.result-title{font-family:var(--font-display);font-weight:900;font-size:18px;margin:0 0 20px;color:var(--tinta-900);text-transform:uppercase;}
.result-content{max-height:80vh;overflow-y:auto;}
.loading{text-align:center;padding:40px 20px;color:var(--neutral-500);}
.spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--hairline);border-top-color:var(--azul-600);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none;}
#output-content{background:transparent;}
#output-content *{background:transparent !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="head-l">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect width="100" height="100" fill="#1060b0" rx="12"/>
        <text x="50" y="65" font-size="60" font-weight="900" text-anchor="middle" fill="white" font-family="Arial">AC</text>
      </svg>
      <div>
        <div class="brand-kicker">Archivo Criollo</div>
        <h1 class="brand-h1">Generador</h1>
      </div>
    </div>
    <div class="beta">Estudio</div>
  </div>

  <div class="layout">
    <!-- FORM -->
    <div class="form-col">
      <h2 class="form-title">Inputs</h2>

      <div class="form-group">
        <label class="form-label">01 Fuente del contenido</label>
        <div class="radio-group">
          <button class="radio-btn active" data-option="guion">Solo guion</button>
          <button class="radio-btn" data-option="efemeride">Solo efeméride</button>
          <button class="radio-btn" data-option="mixto">Guion + efeméride</button>
        </div>
      </div>

      <div class="form-group" id="guion-field">
        <label class="form-label">Guion del podcast</label>
        <textarea id="guion" placeholder="Pega aquí el guion..."></textarea>
      </div>

      <div class="form-group hidden" id="efemeride-field">
        <label class="form-label">Efeméride o noticia</label>
        <input type="text" id="efemeride" placeholder="Ej: Muerte de Perón, Invasión de Malvinas...">
      </div>

      <div class="form-group">
        <label class="form-label">02 Qué querés generar</label>
        <div class="radio-group">
          <button class="checkbox-btn active" data-generate="1video">1 video</button>
          <button class="checkbox-btn" data-generate="3">3 videos</button>
          <button class="checkbox-btn" data-generate="5">5 videos</button>
          <button class="checkbox-btn" data-generate="carrusel">Carrusel IG</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Dificultad de edición</label>
        <div class="difficulty-select">
          <button class="diff-btn" data-difficulty="baja">Baja</button>
          <button class="diff-btn active" data-difficulty="media">Media</button>
          <button class="diff-btn" data-difficulty="alta">Alta</button>
        </div>
      </div>

      <button class="submit-btn" onclick="generateContent()">Generar contenido</button>
    </div>

    <!-- RESULT -->
    <div class="result-col">
      <h2 class="result-title">Contenido Generado</h2>
      <div id="result-content" class="result-content">
        <div class="loading">Espera a que generes contenido...</div>
      </div>
    </div>
  </div>
</div>

<script>
let selectedOption = 'guion';
let selectedGenerate = '1video';
let selectedDifficulty = 'media';

// Option buttons
document.querySelectorAll('[data-option]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('[data-option]').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    selectedOption = e.target.dataset.option;

    document.getElementById('guion-field').classList.toggle('hidden', selectedOption !== 'guion' && selectedOption !== 'mixto');
    document.getElementById('efemeride-field').classList.toggle('hidden', selectedOption !== 'efemeride' && selectedOption !== 'mixto');
  });
});

// Generate buttons
document.querySelectorAll('[data-generate]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('[data-generate]').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    selectedGenerate = e.target.dataset.generate;
  });
});

// Difficulty buttons
document.querySelectorAll('[data-difficulty]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('[data-difficulty]').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    selectedDifficulty = e.target.dataset.difficulty;
  });
});

async function generateContent() {
  const guion = document.getElementById('guion').value.trim();
  const efemeride = document.getElementById('efemeride').value.trim();

  if (!guion && !efemeride) {
    alert('Pegá un guion o efeméride');
    return;
  }

  const resultContent = document.getElementById('result-content');
  resultContent.innerHTML = '<div class="loading"><div class="spinner"></div><p>Generando contenido...</p></div>';

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        guion,
        efemeride,
        tipo: selectedOption,
        generar: selectedGenerate,
        dificultad: selectedDifficulty
      })
    });

    const data = await res.json();
    resultContent.innerHTML = data.content || `<div style="color:red;">Error: ${data.error}</div>`;
  } catch (e) {
    resultContent.innerHTML = `<div style="color:red;">Error: ${e.message}</div>`;
  }
}
</script>
</body>
</html>
